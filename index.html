<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Tavolino Warehouse KPIs</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#f1f5f4;color:#0f172a;font-size:17px}
header{background:#0f766e;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0}
main{padding:14px;max-width:560px;margin:0 auto}
button{font:inherit;border:0;border-radius:12px;padding:14px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#e2e8f0;color:#0f172a}
button.danger{background:#b91c1c}
button.small{padding:8px 12px;font-size:14px;border-radius:8px}
button:disabled{opacity:.35}
input,select{font:inherit;width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{min-height:68px}
.users button{display:block;width:100%;margin-bottom:10px;text-align:left;font-size:19px;background:#fff;color:#0f172a;border:1px solid #cbd5e1}
.now{background:#0f766e;color:#fff}
.now .big{font-size:26px;font-weight:700}
.now .timer{font-size:38px;font-variant-numeric:tabular-nums;font-weight:700}
.task.active{background:#f59e0b;color:#000}
.task.end{background:#b91c1c}
.task.meal{background:#475569}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid #e2e8f0;text-align:left}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal>div{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{flex:1;padding:10px;font-size:15px}
video{width:100%;border-radius:10px;background:#000;max-height:260px}
.muted{color:#64748b;font-size:14px}
.err{color:#b91c1c;font-size:15px;min-height:20px}
h2{font-size:18px;margin:6px 0 10px}
</style>
</head>
<body>
<header><h1 id="ttl">Tavolino Warehouse KPIs</h1><button class="small sec" id="hbtn" style="display:none"></button></header>
<main id="app"></main>
<div id="modal"></div>
<script>
const TASKS=["Start of day","Picking","Meeting / Training","Receiving","Meal Break","Amenities Break","Replenishing","Cleaning","Customer service","Deliveries","Stock Control","Freezer Pick","End of Day"];
const PICK_TASKS=["Picking"]; // tasks that require a pick number
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const timeStr=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const fmtDur=ms=>{ms=Math.max(0,Math.round(ms/1000));return `${Math.floor(ms/3600)}:${pad(Math.floor(ms/60)%60)}:${pad(ms%60)}`};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

// ---------- storage ----------
let db={admin:null,users:[],records:[]};
try{const s=localStorage.getItem('shifttrack_db');if(s)db=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem('shifttrack_db',JSON.stringify(db))}catch(e){alert('Could not save data on this device!')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------- state ----------
let cur=null;        // {role:'user'|'admin', id}
function setSession(){try{if(cur&&cur.role==='user')localStorage.setItem('tavolino_session',cur.id);else localStorage.removeItem('tavolino_session')}catch(e){}}
function logout(){cur=null;setSession();loginScreen()}
let tick=null;
const userById=id=>db.users.find(u=>u.id===id);
const openRec=uid_=>db.records.find(r=>r.userId===uid_&&!r.end);
function closeStale(userId){
  const now=new Date();
  db.records.filter(r=>(!userId||r.userId===userId)&&!r.end&&r.date!==dateStr(now)).forEach(r=>{
    const s=new Date(r.start);const e=new Date(s.getFullYear(),s.getMonth(),s.getDate(),23,59,59);
    r.end=e.toISOString();r.note='Auto-closed (no End of Day)';
  });save();
}

// ---------- screens ----------
function header(title,btnText,btnFn){
  $('#ttl').textContent=title;const b=$('#hbtn');
  if(btnText){b.style.display='';b.textContent=btnText;b.onclick=btnFn}else b.style.display='none';
}
function stopTick(){if(tick){clearInterval(tick);tick=null}}

function loginScreen(){
  stopTick();cur=null;header('Tavolino Warehouse KPIs');
  if(!db.admin){return setupScreen()}
  $('#app').innerHTML=`<h2>Who are you?</h2><div class="users">${db.users.map(u=>`<button data-id="${u.id}">${esc(u.name)}</button>`).join('')||'<p class="muted">No staff added yet. Manager: tap below to add users.</p>'}</div>
  <button class="sec" style="width:100%;margin-top:14px" id="adm">Manager login</button>`;
  document.querySelectorAll('.users button').forEach(b=>b.onclick=()=>pinPrompt(userById(b.dataset.id).name,pin=>{
    const u=userById(b.dataset.id);if(u.pin===pin){cur={role:'user',id:u.id};setSession();closeStale(u.id);workScreen()}else return 'Wrong PIN'}));
  $('#adm').onclick=()=>pinPrompt('Manager',pin=>{if(db.admin.pin===pin){cur={role:'admin'};closeStale();adminScreen('export')}else return 'Wrong PIN'});
}
function setupScreen(){
  $('#app').innerHTML=`<div class="card"><h2>First-time setup</h2><p class="muted">Choose a manager PIN (4+ digits). The manager adds staff and exports the data.</p>
  <input id="p1" type="password" inputmode="numeric" placeholder="Manager PIN"><div style="height:8px"></div>
  <input id="p2" type="password" inputmode="numeric" placeholder="Repeat PIN"><p class="err" id="e"></p><button style="width:100%" id="go">Save</button></div>`;
  $('#go').onclick=()=>{const a=$('#p1').value,b=$('#p2').value;
    if(!/^\d{4,}$/.test(a))return $('#e').textContent='PIN must be at least 4 digits';
    if(a!==b)return $('#e').textContent='PINs do not match';
    db.admin={pin:a};save();loginScreen()};
}
function pinPrompt(name,check){
  $('#modal').innerHTML=`<div class="modal"><div><h2>${esc(name)}</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autofocus>
  <p class="err" id="e"></p><div class="row"><button class="sec" id="c">Cancel</button><button id="ok">Enter</button></div></div></div>`;
  const go=()=>{const r=check($('#pin').value);if(r){$('#e').textContent=r;$('#pin').value=''}else $('#modal').innerHTML=''};
  $('#c').onclick=()=>$('#modal').innerHTML='';$('#ok').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};
  setTimeout(()=>$('#pin').focus(),50);
}

function dayState(userId){
  const today=dateStr(new Date());
  const recs=db.records.filter(r=>r.userId===userId&&r.date===today).sort((a,b)=>a.start<b.start?-1:1);
  const last=recs[recs.length-1];
  return {recs,last,active:!!last&&last.task!=='End of Day'};
}
function workScreen(){
  const u=userById(cur.id);header(u.name,'Log out',logout);
  const st=dayState(u.id),o=openRec(u.id);
  const nowTask=o?o.task:null;
  $('#app').innerHTML=`<div class="card now"><div class="muted" style="color:#ccfbf1">${st.active?'Current task':st.last?'Day finished':'Not started'}</div>
   <div class="big">${esc(nowTask?(o.task+(o.pick?' #'+o.pick:'')):st.last?'End of Day recorded':'Tap "Start of day"')}</div>
   <div class="timer" id="tm">${o?'0:00:00':''}</div><div class="muted" style="color:#ccfbf1">${o?'Started '+timeStr(new Date(o.start)):''}</div></div>
   <div class="grid">${TASKS.map((t,i)=>{
     let dis=false,cls='task';
     if(!st.active){dis=t!=='Start of day'}else{dis=t==='Start of day'}
     if(t===nowTask){cls+=' active';if(!PICK_TASKS.includes(t))dis=true}
     if(t==='End of Day')cls+=' end';if(t==='Meal Break')cls+=' meal';
     return `<button class="${cls}" data-t="${i}" ${dis?'disabled':''} ${t==='Start of day'||t==='End of Day'?'style="grid-column:span 2"':''}>${esc(t===nowTask&&PICK_TASKS.includes(t)?'Next pick (new number)':t)}</button>`}).join('')}</div>
   <div class="card" style="margin-top:14px"><h2>Today</h2><table>${st.recs.map(r=>`<tr><td>${timeStr(new Date(r.start))}</td><td>${esc(r.task)}${r.pick?' #'+esc(r.pick):''}</td><td>${r.end?fmtDur(new Date(r.end)-new Date(r.start)):'…'}</td></tr>`).join('')||'<tr><td class="muted">Nothing yet</td></tr>'}</table></div>`;
  document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>chooseTask(TASKS[b.dataset.t]));
  stopTick();if(o){const s=new Date(o.start);const f=()=>{const e=$('#tm');if(e)e.textContent=fmtDur(Date.now()-s)};f();tick=setInterval(f,1000)}
}
function chooseTask(task){
  if(task==='End of Day'){
    $('#modal').innerHTML=`<div class="modal"><div><h2>End your day?</h2><p class="muted">This stops all timing.</p><div class="row"><button class="sec" id="c">Cancel</button><button class="danger" id="ok">End of Day</button></div></div></div>`;
    $('#c').onclick=()=>$('#modal').innerHTML='';$('#ok').onclick=()=>{$('#modal').innerHTML='';startTask(task,'')};return;
  }
  if(PICK_TASKS.includes(task))return pickPrompt(p=>startTask(task,p));
  startTask(task,'');
}
function startTask(task,pick){
  const now=new Date(),u=cur.id,o=openRec(u);
  if(o)o.end=now.toISOString();
  const rec={id:uid(),userId:u,user:userById(u).name,date:dateStr(now),task,pick,start:now.toISOString(),end:task==='End of Day'?now.toISOString():null,note:''};
  db.records.push(rec);save();workScreen();
}
let scanStream=null,scanTimer=null;
function stopScan(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
function pickPrompt(cb){
  $('#modal').innerHTML=`<div class="modal"><div><h2>Pick number</h2>
   <div id="vid" style="display:none"><video id="v" playsinline muted></video></div>
   <input id="pk" placeholder="Scan or type pick number" autocomplete="off">
   <p class="err" id="e"></p>
   <div class="row"><button class="sec" id="sc">📷 Scan barcode</button></div>
   <div class="row"><button class="sec" id="c">Cancel</button><button id="ok">Start picking</button></div></div></div>`;
  const done=()=>{stopScan();$('#modal').innerHTML=''};
  $('#c').onclick=done;
  $('#ok').onclick=()=>{const v=$('#pk').value.trim();if(!v)return $('#e').textContent='Pick number required';done();cb(v)};
  $('#sc').onclick=async()=>{
    if(!('BarcodeDetector' in window)){return $('#e').textContent='Scanner not supported on this browser - type the number.'}
    try{
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const v=$('#v');v.srcObject=scanStream;await v.play();$('#vid').style.display='';
      const det=new BarcodeDetector();
      scanTimer=setInterval(async()=>{try{const c=await det.detect(v);if(c.length){const val=c[0].rawValue;stopScan();$('#vid').style.display='none';$('#pk').value=val;if(navigator.vibrate)navigator.vibrate(100)}}catch(e){}},300);
    }catch(e){$('#e').textContent='Camera not available - allow camera access or type the number.'}
  };
}

// ---------- admin ----------
function adminScreen(tab){
  stopTick();header('Manager',"Log out",logout);
  const tabs=[['export','Export'],['live','Today'],['users','Staff'],['import','Merge'],['set','Settings']];
  $('#app').innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?'':'sec'}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="tab"></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>adminScreen(b.dataset.t));
  const el=$('#tab');
  if(tab==='export'){
    const t=dateStr(new Date());
    el.innerHTML=`<div class="card"><h2>Export data</h2><p class="muted">Opens in Excel. ${db.records.length} records on this device.</p>
     <label class="muted">From</label><input type="date" id="f" value="${t}"><div style="height:8px"></div><label class="muted">To</label><input type="date" id="t" value="${t}"><div style="height:8px"></div>
     <button style="width:100%;margin-bottom:8px" id="d">Download detailed log (CSV)</button>
     <button class="sec" style="width:100%" id="s">Download summary by task (CSV)</button></div>`;
    const rng=()=>db.records.filter(r=>r.date>=$('#f').value&&r.date<=$('#t').value);
    $('#d').onclick=()=>download(`tavolino-detail-${$('#f').value}_${$('#t').value}.csv`,detailCsv(rng()));
    $('#s').onclick=()=>download(`tavolino-summary-${$('#f').value}_${$('#t').value}.csv`,summaryCsv(rng()));
  }else if(tab==='live'){
    const t=dateStr(new Date());
    el.innerHTML=`<div class="card"><h2>Today</h2><table><tr><th>Staff</th><th>Now</th><th>Since</th></tr>${db.users.map(u=>{const o=openRec(u.id);const st=dayState(u.id);
      return `<tr><td>${esc(u.name)}</td><td>${o?esc(o.task+(o.pick?' #'+o.pick:'')):st.last?'Finished':'Not started'}</td><td>${o?timeStr(new Date(o.start)):''}</td></tr>`}).join('')}</table></div>`;
  }else if(tab==='users'){
    el.innerHTML=`<div class="card"><h2>Add staff</h2><input id="n" placeholder="Name"><div style="height:8px"></div><input id="p" inputmode="numeric" placeholder="4-digit PIN"><p class="err" id="e"></p><button style="width:100%" id="a">Add</button></div>
     <div class="card"><h2>Staff</h2>${db.users.map(u=>`<div class="row" style="align-items:center"><div style="flex:2">${esc(u.name)}</div><button class="small sec" data-r="${u.id}">Reset PIN</button><button class="small danger" data-d="${u.id}">Remove</button></div>`).join('')||'<p class="muted">None yet</p>'}</div>`;
    $('#a').onclick=()=>{const n=$('#n').value.trim(),p=$('#p').value.trim();
      if(!n)return $('#e').textContent='Enter a name';if(!/^\d{4}$/.test(p))return $('#e').textContent='PIN must be 4 digits';
      if(db.users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return $('#e').textContent='Name already exists';
      db.users.push({id:uid(),name:n,pin:p});save();adminScreen('users')};
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>pinPrompt('New 4-digit PIN for '+userById(b.dataset.r).name,p=>{if(!/^\d{4}$/.test(p))return 'Must be 4 digits';userById(b.dataset.r).pin=p;save()}));
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const u=userById(b.dataset.d);
      $('#modal').innerHTML=`<div class="modal"><div><h2>Remove ${esc(u.name)}?</h2><p class="muted">Their recorded data is kept for export.</p><div class="row"><button class="sec" id="c">Cancel</button><button class="danger" id="ok">Remove</button></div></div></div>`;
      $('#c').onclick=()=>$('#modal').innerHTML='';$('#ok').onclick=()=>{db.users=db.users.filter(x=>x.id!==u.id);save();$('#modal').innerHTML='';adminScreen('users')}});
  }else if(tab==='import'){
    el.innerHTML=`<div class="card"><h2>Merge data from other devices</h2><p class="muted">Each device exports its own detailed CSV. Load those files here (all at once is fine), then export the combined result from the Export tab. Duplicates are skipped.</p>
     <input type="file" id="fi" accept=".csv" multiple><p id="msg" class="muted"></p></div>`;
    $('#fi').onchange=async e=>{let add=0,dup=0,bad=0;
      for(const f of e.target.files){const rows=parseCsv(await f.text());const h=rows.shift()||[];const ix=n=>h.indexOf(n);
        if(ix('Record ID')<0){bad++;continue}
        for(const r of rows){if(r.length<h.length)continue;const id=r[ix('Record ID')];if(db.records.some(x=>x.id===id)){dup++;continue}
          const sd=r[ix('Start')],ed=r[ix('End')];
          db.records.push({id,userId:'imp:'+r[ix('User')],user:r[ix('User')],date:r[ix('Date')],task:r[ix('Task')],pick:r[ix('Pick Number')],
            start:new Date(sd.replace(' ','T')).toISOString(),end:ed?new Date(ed.replace(' ','T')).toISOString():null,note:r[ix('Note')]||''});add++}}
      save();$('#msg').textContent=`Added ${add} records, skipped ${dup} duplicates${bad?`, ${bad} file(s) not recognised`:''}.`};
  }else{
    el.innerHTML=`<div class="card"><h2>Manager PIN</h2><input id="p" type="password" inputmode="numeric" placeholder="New manager PIN"><p class="err" id="e"></p><button style="width:100%" id="s">Change PIN</button></div>
     <div class="card"><h2>Danger zone</h2><button class="danger" style="width:100%" id="w">Delete all records on this device</button></div>`;
    $('#s').onclick=()=>{const p=$('#p').value;if(!/^\d{4,}$/.test(p))return $('#e').textContent='At least 4 digits';db.admin.pin=p;save();$('#e').textContent='Saved'};
    $('#w').onclick=()=>{$('#modal').innerHTML=`<div class="modal"><div><h2>Delete ALL records?</h2><p class="muted">Export first. This cannot be undone.</p><div class="row"><button class="sec" id="c">Cancel</button><button class="danger" id="ok">Delete</button></div></div></div>`;
      $('#c').onclick=()=>$('#modal').innerHTML='';$('#ok').onclick=()=>{db.records=[];save();$('#modal').innerHTML=''}};
  }
}

// ---------- CSV ----------
const q=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function detailCsv(recs){
  const rows=[['Date','User','Task','Pick Number','Start','End','Duration (h:mm:ss)','Minutes','Note','Record ID']];
  recs.slice().sort((a,b)=>a.user<b.user?-1:a.user>b.user?1:a.start<b.start?-1:1).forEach(r=>{
    const s=new Date(r.start),e=r.end?new Date(r.end):null;
    rows.push([r.date,r.user,r.task,r.pick,dateStr(s)+' '+timeStr(s),e?dateStr(e)+' '+timeStr(e):'',e?fmtDur(e-s):'',e?((e-s)/60000).toFixed(2):'',r.note||'',r.id])});
  return rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function summaryCsv(recs){
  const m={};recs.forEach(r=>{if(!r.end||r.task==='End of Day')return;const k=[r.date,r.user,r.task].join('\u0001');
    (m[k]=m[k]||{n:0,ms:0}).n++;m[k].ms+=new Date(r.end)-new Date(r.start)});
  const rows=[['Date','User','Task','Times selected','Total minutes','Total (h:mm:ss)']];
  Object.keys(m).sort().forEach(k=>{const [d,u,t]=k.split('\u0001');rows.push([d,u,t,m[k].n,(m[k].ms/60000).toFixed(2),fmtDur(m[k].ms)])});
  return rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function parseCsv(t){
  t=t.replace(/^﻿/,'');const out=[];let row=[],f='',inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c==='"')inq=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')out.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);out.push(row)}return out;
}
function download(name,text){
  const b=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

(function boot(){
  try{const id=localStorage.getItem('tavolino_session');
    if(db.admin&&id&&userById(id)){cur={role:'user',id};closeStale(id);return workScreen()}}catch(e){}
  loginScreen();
})();
</script>
</body>
</html>
